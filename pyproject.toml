[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bg-spotter"
version = "2.1.0"
description = "Edit-point AAF guide-track generator for post-production sound (Akahon Audio)"
# 3.9 is the system Python on Intel Macs; validated there and on 3.12 (arm64).
requires-python = ">=3.9"
dependencies = [
    "pyaaf2",
    "scenedetect",
    "PySide6",
]

[project.optional-dependencies]
# olefile: tests assert on raw essence bytes inside the OLE container; pyaaf2
# declares no dependencies, so it is not pulled in transitively.
dev = ["pytest", "pytest-qt", "pyinstaller", "olefile"]

[project.scripts]
bg-spotter = "bg_spotter.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bg_spotter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
