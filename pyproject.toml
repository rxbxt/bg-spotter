[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bg-spotter"
version = "2.0.0"
description = "Edit-point AAF guide-track generator for post-production sound (Akahon Audio)"
requires-python = ">=3.11"
dependencies = [
    "pyaaf2",
    "scenedetect",
    "PySide6",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-qt", "pyinstaller"]

[project.scripts]
bg-spotter = "bg_spotter.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bg_spotter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
